 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Send - Ultimate</title>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #075e54; --secondary: #128c7e; --bg: #e5ddd5; --white: #fff; --gray: #f0f2f5; --active-tab: #075e54; --inactive-tab: #999; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); height: 100dvh; display: flex; justify-content: center; overflow: hidden; }
        
        .app-wrapper { width: 100%; max-width: 500px; height: 100%; background: white; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }

        /* MODE SELECTION */
        .mode-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: transform 0.4s; }
        .mode-btn { background: white; color: var(--primary); width: 80%; padding: 20px; border-radius: 15px; margin: 10px; text-align: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .mode-btn:active { transform: scale(0.95); }

        /* CLOUD UI */
        .cloud-ui { display: none; height: 100%; flex-direction: column; }
        .auth-container { display: flex; flex-direction: column; height: 100%; padding: 30px; justify-content: center; align-items: center; background: white; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 25px; outline: none; background: #f9f9f9; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 25px; background: var(--secondary); color: white; font-weight: bold; cursor: pointer; }
        
        /* Dashboard Tabs */
        .tab-screen { display: none; height: 100%; flex-direction: column; }
        .tab-screen.active-screen { display: flex; }
        .header-bar { padding: 15px; background: var(--primary); color: white; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .cloud-content { flex-grow: 1; overflow-y: auto; }
        
        .chat-list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .user-avatar { width: 50px; height: 50px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* Profile */
        .profile-container { padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .profile-pic-large { width: 120px; height: 120px; background: #ddd; border-radius: 50%; margin-bottom: 15px; overflow: hidden; position: relative; border: 3px solid var(--primary); }
        .profile-pic-large img { width: 100%; height: 100%; object-fit: cover; }
        .upload-btn { background: #333; color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; margin-top: -10px; margin-bottom: 20px; z-index: 10; }
        
        /* Bottom Nav */
        .bottom-nav { height: 60px; border-top: 1px solid #ddd; background: white; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--inactive-tab); font-size: 10px; cursor: pointer; padding: 5px; width: 33%; }
        .nav-item.active { color: var(--active-tab); font-weight: bold; }

        /* Chat Overlay */
        .chat-screen { display: none; flex-direction: column; height: 100%; background: #e5ddd5; position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .msg-list { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-break: break-word; }
        .sent { align-self: flex-end; background: #dcf8c6; }

        /* P2P UI (Restored) */
        .p2p-container { display: none; width: 100%; height: 100%; flex-direction: column; }
        .p2p-sidebar { background: #f0f2f5; padding: 15px; display: flex; flex-direction: column; border-bottom: 1px solid #ddd; }
        .p2p-chat-area { flex-grow: 1; background: #e5ddd5; display: flex; flex-direction: column; }
        #qrcode { background: white; padding: 10px; border-radius: 10px; align-self: center; margin-bottom: 10px; }

        .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; }
    </style>
</head>
<body>

    <div class="loading" id="loader">Processing...</div>

    <div class="app-wrapper">
        
        <!-- MODE SELECTION -->
        <div class="mode-screen" id="mode-screen">
            <h2 style="margin-bottom:30px;">QR Send Ultimate</h2>
            <div class="mode-btn" onclick="initMode('p2p')"><i class="fas fa-qrcode"></i><h3>Offline P2P</h3></div>
            <div class="mode-btn" onclick="initMode('cloud')"><i class="fas fa-cloud"></i><h3>Cloud Account</h3></div>
        </div>

        <!-- P2P UI (Full Restore) -->
        <div class="p2p-container" id="p2p-ui">
            <div class="header-bar">
                <i class="fas fa-arrow-left" onclick="goHome()" style="cursor:pointer;"></i>
                <span>Offline P2P</span>
                <span id="p2p-status" style="font-size:12px;background:rgba(255,255,255,0.2);padding:2px 5px;border-radius:5px;">Disconnected</span>
            </div>
            
            <div class="p2p-sidebar" id="p2p-connect">
                <div id="qrcode"></div>
                <div style="text-align:center;">
                    <button class="action-btn" onclick="startScanner()" style="width:auto; padding:8px 20px;">Scan QR</button>
                </div>
            </div>

            <div class="p2p-chat-area">
                <div class="msg-list" id="p2p-messages"></div>
                <div style="padding:10px; background:#f0f2f5; display:flex; gap:10px;">
                    <button onclick="document.getElementById('p2p-file').click()" style="border:none; background:none; font-size:20px;">📎</button>
                    <input type="file" id="p2p-file" style="display:none" onchange="sendP2PFile()">
                    <input type="text" id="p2p-input" style="flex-grow:1; padding:10px; border-radius:20px; border:none;" placeholder="Message...">
                    <button onclick="sendP2PText()" style="border:none; background:var(--primary); color:white; width:40px; height:40px; border-radius:50%;">➤</button>
                </div>
            </div>
        </div>

        <!-- CLOUD UI -->
        <div class="cloud-ui" id="cloud-ui">
            <!-- Auth -->
            <div class="auth-container" id="auth-screen">
                <h2 style="color:var(--primary);margin-bottom:20px;">Cloud Login</h2>
                <input type="text" id="c-user" class="auth-input" placeholder="Username">
                <input type="password" id="c-pass" class="auth-input" placeholder="Password">
                <button class="action-btn" onclick="handleCloudLogin()">Login</button>
                <button class="action-btn" onclick="handleCloudSignup()" style="background:white; color:var(--primary); border:1px solid var(--primary); margin-top:10px;">Sign Up</button>
                <p onclick="goHome()" style="margin-top:20px; color:#666; cursor:pointer;">← Back Home</p>
            </div>

            <!-- Dashboard -->
            <div id="cloud-dash" style="display:none; height:100%; flex-direction:column;">
                
                <!-- Tab 1: Inbox -->
                <div id="tab-inbox" class="tab-screen active-screen">
                    <div class="header-bar">
                        <i class="fas fa-arrow-left" onclick="goHome()" style="cursor:pointer; font-size:16px;"></i> 
                        <span>Inbox</span>
                        <i class="fas fa-sync" onclick="loadInboxUI()"></i>
                    </div>
                    <div class="cloud-content" id="inbox-list"></div>
                </div>

                <!-- Tab 2: Search -->
                <div id="tab-search" class="tab-screen">
                    <div class="header-bar">Search</div>
                    <div style="padding:15px;">
                        <input type="text" class="auth-input" placeholder="Search user..." oninput="searchCloudUser(this.value)">
                        <div id="search-results"></div>
                    </div>
                </div>

                <!-- Tab 3: Profile -->
                <div id="tab-profile" class="tab-screen">
                    <div class="header-bar">Profile</div>
                    <div class="profile-container">
                        <div class="profile-pic-large" id="my-profile-pic">
                            <i class="fas fa-user" style="margin-top:35px; font-size:50px; color:#ccc;"></i>
                        </div>
                        <label class="upload-btn" for="pic-upload">Upload Photo</label>
                        <input type="file" id="pic-upload" style="display:none" accept="image/*" onchange="uploadProfilePic()">
                        
                        <h3 id="display-username">@user</h3>
                        
                        <div style="width:100%; text-align:left; margin-top:20px; color:#666; font-size:12px;">Display Name</div>
                        <input type="text" id="edit-name" class="auth-input" placeholder="Name">
                        
                        <button class="action-btn" onclick="saveProfile()">Save Changes</button>
                        <button class="action-btn" onclick="cloudLogout()" style="background:#f8d7da; color:#721c24; margin-top:10px;">Log Out</button>
                    </div>
                </div>

                <!-- Nav -->
                <div class="bottom-nav">
                    <div class="nav-item active" onclick="switchTab('inbox', this)"><i class="fas fa-comment-alt"></i>Chats</div>
                    <div class="nav-item" onclick="switchTab('search', this)"><i class="fas fa-search"></i>Search</div>
                    <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user-circle"></i>Profile</div>
                </div>
            </div>

            <!-- Cloud Chat Overlay -->
            <div class="chat-screen" id="cloud-chat">
                <div class="header-bar" style="background:#f0f2f5; color:#333;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer;"></i>
                        <div class="user-avatar" style="width:35px; height:35px;" id="chat-av-small"></div>
                        <b id="chat-header-name">User</b>
                    </div>
                </div>
                <div id="c-msg-list" class="msg-list"></div>
                <div style="padding:10px; background:#f0f2f5; display:flex; gap:10px;">
                    <input type="text" id="c-input" style="flex-grow:1; padding:10px; border-radius:20px; border:none;" placeholder="Message...">
                    <button onclick="sendCloudText()" style="border:none; background:var(--primary); color:white; width:40px; height:40px; border-radius:50%;">➤</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Scanner Overlay -->
    <div id="scanner-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:black;display:none;flex-direction:column;">
        <button onclick="stopScanner()" style="position:absolute;top:20px;right:20px;background:none;border:none;color:white;font-size:30px;">✕</button>
        <div id="qr-reader" style="flex-grow:1;"></div>
    </div>

    <script>
        // --- CONFIG ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzNJzNxHm1G7gPURcn2dDGYtMw_p4X_QEXFXpXz3tq_ZbpUFNbTeRDg2UMkS3UWNhdfow/exec"; 

        // --- STATE ---
        let mode = '';
        let currentUser = localStorage.getItem('qr_user');
        let currentName = localStorage.getItem('qr_name');
        let currentPic = localStorage.getItem('qr_pic');
        let activePartner = null;
        let pollTimer = null;
        
        // P2P Vars
        let peer, conn, myId, qrScanner;

        // --- NAVIGATION ---
        function goHome() {
            document.getElementById('mode-screen').style.display = 'flex';
            document.getElementById('p2p-ui').style.display = 'none';
            document.getElementById('cloud-ui').style.display = 'none';
            if(peer) { peer.destroy(); peer = null; }
        }

        function initMode(m) {
            mode = m;
            document.getElementById('mode-screen').style.display = 'none';
            if(m === 'p2p') {
                document.getElementById('p2p-ui').style.display = 'flex';
                initP2P();
            } else {
                document.getElementById('cloud-ui').style.display = 'flex';
                if(currentUser) initDash();
                else document.getElementById('auth-screen').style.display = 'flex';
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-screen').forEach(t => t.classList.remove('active-screen'));
            document.getElementById('tab-' + tab).classList.add('active-screen');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if(tab === 'profile') loadProfileUI();
            if(tab === 'inbox') loadInboxUI();
        }

        // --- CLOUD LOGIC ---
        async function handleCloudLogin() {
            const u = document.getElementById('c-user').value.trim();
            const p = document.getElementById('c-pass').value.trim();
            showLoader(true);
            const res = await api({ action: 'login', username: u, password: p });
            showLoader(false);
            if(res.status === 'success') {
                saveSession(res);
                document.getElementById('auth-screen').style.display = 'none';
                initDash();
            } else alert(res.message);
        }

        async function handleCloudSignup() {
            const u = document.getElementById('c-user').value.trim();
            const p = document.getElementById('c-pass').value.trim();
            showLoader(true);
            const res = await api({ action: 'signup', username: u, password: p });
            showLoader(false);
            if(res.status === 'success') alert("Created! Login now.");
            else alert(res.message);
        }

        function saveSession(data) {
            currentUser = data.username;
            currentName = data.name;
            currentPic = data.profilePic;
            localStorage.setItem('qr_user', currentUser);
            localStorage.setItem('qr_name', currentName);
            localStorage.setItem('qr_pic', currentPic);
        }

        function initDash() {
            document.getElementById('cloud-dash').style.display = 'flex';
            loadInboxUI();
        }

        function cloudLogout() {
            if(confirm("Log Out?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- PROFILE UPLOAD ---
        function loadProfileUI() {
            document.getElementById('display-username').innerText = "@" + currentUser;
            document.getElementById('edit-name').value = currentName || "";
            if(currentPic) document.getElementById('my-profile-pic').innerHTML = `<img src="${currentPic}">`;
        }

        async function uploadProfilePic() {
            const file = document.getElementById('pic-upload').files[0];
            if(!file) return;
            
            showLoader(true);
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1];
                const res = await api({
                    action: 'uploadFile',
                    fileData: base64,
                    fileName: 'profile_' + currentUser + '.jpg',
                    mimeType: file.type
                });
                
                if(res.status === 'success') {
                    // Update profile with new URL
                    await api({ action: 'updateProfile', username: currentUser, profilePic: res.fileUrl });
                    currentPic = res.fileUrl;
                    localStorage.setItem('qr_pic', currentPic);
                    loadProfileUI();
                    alert("Photo Uploaded!");
                } else {
                    alert("Upload Failed: " + res.message);
                }
                showLoader(false);
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const name = document.getElementById('edit-name').value;
            showLoader(true);
            await api({ action: 'updateProfile', username: currentUser, name: name });
            currentName = name;
            localStorage.setItem('qr_name', name);
            showLoader(false);
            alert("Saved");
        }

        // --- MESSAGING ---
        async function loadInboxUI() {
            const res = await api({ action: 'getMessages', username: currentUser });
            const list = document.getElementById('inbox-list');
            list.innerHTML = '';
            
            if(res.status === 'success') {
                const partners = {};
                res.data.forEach(m => {
                    const p = m.sender === currentUser ? m.receiver : m.sender;
                    partners[p] = true;
                });
                
                Object.keys(partners).forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'chat-list-item';
                    div.innerHTML = `<div class="user-avatar">${p[0].toUpperCase()}</div><div><b>${p}</b></div>`;
                    div.onclick = () => openChat(p);
                    list.appendChild(div);
                });
                
                if(list.children.length === 0) list.innerHTML = "<div style='padding:20px;text-align:center;color:#999'>No messages</div>";
            }
        }

        async function searchCloudUser(q) {
            const box = document.getElementById('search-results');
            if(q.length < 2) { box.innerHTML=''; return; }
            const res = await api({ action: 'search', query: q });
            box.innerHTML = '';
            if(res.status === 'success') {
                res.data.forEach(u => {
                    if(u.username === currentUser) return;
                    const div = document.createElement('div');
                    div.className = 'chat-list-item';
                    div.innerHTML = `<div class="user-avatar">${u.profilePic ? `<img src="${u.profilePic}">` : u.name[0]}</div><div>${u.name} (@${u.username})</div>`;
                    div.onclick = () => openChat(u.username, u.name, u.profilePic);
                    box.appendChild(div);
                });
            }
        }

        function openChat(username, name, pic) {
            activePartner = username;
            document.getElementById('cloud-chat').style.display = 'flex';
            document.getElementById('chat-header-name').innerText = name || username;
            document.getElementById('chat-av-small').innerHTML = pic ? `<img src="${pic}">` : (name ? name[0] : username[0]);
            
            loadChatMsgs();
            pollTimer = setInterval(loadChatMsgs, 3000);
        }

        function closeChat() {
            clearInterval(pollTimer);
            document.getElementById('cloud-chat').style.display = 'none';
            activePartner = null;
        }

        async function sendCloudText() {
            const txt = document.getElementById('c-input').value;
            if(!txt) return;
            const enc = CryptoJS.AES.encrypt(txt, 'SECRET').toString();
            document.getElementById('c-input').value = '';
            appendMsg(txt, 'sent', 'c-msg-list');
            await api({ action: 'sendMessage', sender: currentUser, receiver: activePartner, content: enc, type: 'text' });
        }

        async function loadChatMsgs() {
            if(!activePartner) return;
            const res = await api({ action: 'getMessages', username: currentUser });
            const box = document.getElementById('c-msg-list');
            const relevant = res.data.filter(m => (m.sender===currentUser && m.receiver===activePartner) || (m.sender===activePartner && m.receiver===currentUser));
            
            if(box.childElementCount !== relevant.length) {
                box.innerHTML = '';
                relevant.slice(-20).forEach(m => {
                    try {
                        const dec = CryptoJS.AES.decrypt(m.content, 'SECRET').toString(CryptoJS.enc.Utf8);
                        appendMsg(dec, m.sender===currentUser ? 'sent' : 'received', 'c-msg-list');
                    } catch(e) { appendMsg("Encrypted", 'received', 'c-msg-list'); }
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        // --- P2P LOGIC (RESTORED) ---
        function initP2P() {
            if(peer) return;
            const hash = window.location.hash.substring(1);
            const isHost = !hash;
            peer = new Peer(undefined, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            
            peer.on('open', id => {
                myId = id;
                if(isHost) new QRCode(document.getElementById('qrcode'), { text: window.location.href + '#' + id, width: 128, height: 128 });
                else {
                    document.getElementById('p2p-connect').style.display = 'none';
                    document.getElementById('p2p-status').innerText = "Connecting...";
                    conn = peer.connect(hash);
                    setupConn();
                }
            });
            peer.on('connection', c => { conn = c; setupConn(); });
            peer.on('error', e => alert("P2P Error: " + e));
        }

        function setupConn() {
            conn.on('open', () => {
                document.getElementById('p2p-connect').style.display = 'none';
                document.getElementById('p2p-status').innerText = "Connected";
            });
            conn.on('data', d => {
                if(d.type === 'text') appendMsg(d.content, 'received', 'p2p-messages');
            });
        }

        function sendP2PText() {
            const val = document.getElementById('p2p-input').value;
            if(!conn || !val) return;
            conn.send({type:'text', content:val});
            appendMsg(val, 'sent', 'p2p-messages');
            document.getElementById('p2p-input').value = '';
        }

        function appendMsg(txt, type, containerId) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${type}`;
            div.innerText = txt;
            document.getElementById(containerId).appendChild(div);
        }

        function startScanner() {
            document.getElementById('scanner-overlay').style.display = 'flex';
            qrScanner = new Html5Qrcode("qr-reader");
            qrScanner.start({facingMode:"environment"}, {fps:10}, t => {
                if(t) { window.location.hash = t.split('#')[1] || t; window.location.reload(); }
            });
        }
        function stopScanner() { if(qrScanner) qrScanner.stop(); document.getElementById('scanner-overlay').style.display='none'; }

        // --- API UTILS ---
        async function api(data) {
            try {
                const req = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                return await req.json();
            } catch(e) { return { status: 'error', message: e.toString() }; }
        }
        function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
    </script>
</body>
</html>
