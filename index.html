 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Send - Ultimate</title>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #075e54; --secondary: #128c7e; --bg: #e5ddd5; --white: #fff; --gray: #f0f2f5; --active-tab: #075e54; --inactive-tab: #999; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); height: 100dvh; display: flex; justify-content: center; overflow: hidden; }
        
        .app-wrapper { width: 100%; max-width: 500px; height: 100%; background: white; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; }

        /* --- CLOUD DASHBOARD LAYOUT --- */
        .cloud-ui { display: none; height: 100%; flex-direction: column; }
        .cloud-content { flex-grow: 1; overflow-y: auto; position: relative; }
        
        /* Bottom Navigation */
        .bottom-nav { height: 60px; border-top: 1px solid #ddd; background: white; display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--inactive-tab); font-size: 10px; cursor: pointer; padding: 5px; width: 33%; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }
        .nav-item.active { color: var(--active-tab); font-weight: bold; }

        /* TAB 1: INBOX */
        .tab-screen { display: none; height: 100%; flex-direction: column; }
        .tab-screen.active-screen { display: flex; }
        
        .header-bar { padding: 15px; background: var(--primary); color: white; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .chat-list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .chat-list-item:hover { background: #f9f9f9; }
        .user-avatar { width: 50px; height: 50px; background: #ddd; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; overflow: hidden; object-fit: cover; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* TAB 2: SEARCH */
        .search-container { padding: 15px; }
        .search-box { width: 100%; padding: 12px 15px; border-radius: 25px; border: 1px solid #ddd; background: var(--gray); outline: none; margin-bottom: 15px; }
        .search-result-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        /* TAB 3: PROFILE */
        .profile-container { padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .profile-pic-large { width: 100px; height: 100px; background: #ddd; border-radius: 50%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #666; overflow: hidden; position: relative; }
        .profile-pic-large img { width: 100%; height: 100%; object-fit: cover; }
        .profile-label { align-self: flex-start; font-size: 12px; color: #666; margin-top: 15px; margin-bottom: 5px; }
        .profile-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .save-btn { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .logout-btn { width: 100%; padding: 12px; background: #f8d7da; color: #721c24; border: none; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; }

        /* --- AUTH & P2P & CHAT (Same as before) --- */
        .auth-container { display: flex; flex-direction: column; height: 100%; padding: 30px; justify-content: center; align-items: center; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 25px; outline: none; background: #f9f9f9; }
        .action-btn { width: 100%; padding: 12px; border: none; border-radius: 25px; background: var(--secondary); color: white; font-weight: bold; cursor: pointer; }
        
        .chat-screen { display: none; flex-direction: column; height: 100%; background: #e5ddd5; position: absolute; top: 0; left: 0; width: 100%; z-index: 100; }
        .msg-list { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .input-zone { padding: 10px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        
        .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 3000; }
        
        /* MODE SELECTION */
        .mode-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .mode-btn { background: white; color: var(--primary); width: 80%; padding: 20px; border-radius: 15px; margin: 10px; text-align: center; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="loading" id="loader">Processing...</div>

    <div class="app-wrapper">
        
        <!-- MODE SELECTION -->
        <div class="mode-screen" id="mode-screen">
            <h2 style="margin-bottom:30px;">QR Send Ultimate</h2>
            <div class="mode-btn" onclick="initMode('p2p')"><i class="fas fa-qrcode"></i><h3>Offline P2P</h3></div>
            <div class="mode-btn" onclick="initMode('cloud')"><i class="fas fa-cloud"></i><h3>Cloud Account</h3></div>
        </div>

        <!-- CLOUD AUTH -->
        <div class="auth-container" id="auth-ui" style="display:none;">
            <h2 style="color:var(--primary);margin-bottom:20px;">Welcome</h2>
            <input type="text" id="c-user" class="auth-input" placeholder="Username">
            <input type="password" id="c-pass" class="auth-input" placeholder="Password">
            <button class="action-btn" onclick="handleCloudLogin()">Login</button>
            <button class="action-btn" onclick="handleCloudSignup()" style="background:white; color:var(--primary); border:1px solid var(--primary); margin-top:10px;">Sign Up</button>
            <p onclick="location.reload()" style="margin-top:20px; color:#666; cursor:pointer;">Back</p>
        </div>

        <!-- CLOUD DASHBOARD -->
        <div class="cloud-ui" id="cloud-dash">
            <!-- 1. INBOX TAB -->
            <div id="tab-inbox" class="tab-screen active-screen">
                <div class="header-bar">QR Send <i class="fas fa-sync" style="font-size:14px; cursor:pointer;" onclick="loadMessages()"></i></div>
                <div class="cloud-content" id="inbox-list">
                    <div style="padding:20px; text-align:center; color:#999;">Loading Chats...</div>
                </div>
            </div>

            <!-- 2. SEARCH TAB -->
            <div id="tab-search" class="tab-screen">
                <div class="header-bar">Search Users</div>
                <div class="search-container">
                    <input type="text" class="search-box" placeholder="Search by name or username..." oninput="searchCloudUser(this.value)">
                    <div id="search-results"></div>
                </div>
            </div>

            <!-- 3. PROFILE TAB -->
            <div id="tab-profile" class="tab-screen">
                <div class="header-bar">My Profile</div>
                <div class="profile-container">
                    <div class="profile-pic-large" id="my-profile-pic">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 id="display-username">@username</h3>
                    
                    <div class="profile-label">Display Name</div>
                    <input type="text" id="edit-name" class="profile-input" placeholder="Your Name">
                    
                    <div class="profile-label">Profile Picture URL</div>
                    <input type="text" id="edit-pic" class="profile-input" placeholder="https://example.com/photo.jpg">
                    
                    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
                    <button class="logout-btn" onclick="cloudLogout()">Log Out</button>
                </div>
            </div>

            <!-- BOTTOM NAVIGATION -->
            <div class="bottom-nav">
                <div class="nav-item active" onclick="switchTab('inbox', this)">
                    <i class="fas fa-comment-alt"></i> Chats
                </div>
                <div class="nav-item" onclick="switchTab('search', this)">
                    <i class="fas fa-search"></i> Search
                </div>
                <div class="nav-item" onclick="switchTab('profile', this)">
                    <i class="fas fa-user-circle"></i> Profile
                </div>
            </div>
        </div>

        <!-- CHAT SCREEN (Overlay) -->
        <div class="chat-screen" id="cloud-chat">
            <div class="header-bar" style="background:#f0f2f5; color:#333; padding:10px;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fas fa-arrow-left" onclick="closeChat()" style="cursor:pointer;"></i>
                    <div class="user-avatar" style="width:35px; height:35px;" id="chat-av-small">?</div>
                    <b id="chat-header-name">User</b>
                </div>
            </div>
            <div id="c-msg-list" class="msg-list"></div>
            <div class="input-zone">
                <input type="text" id="c-input" style="flex-grow:1; padding:10px; border-radius:20px; border:none; outline:none;" placeholder="Message...">
                <button onclick="sendCloudText()" style="border:none; background:var(--primary); color:white; width:40px; height:40px; border-radius:50%;">➤</button>
            </div>
        </div>

        <!-- P2P PLACEHOLDER -->
        <div id="p2p-ui" style="display:none; height:100%; flex-direction:column; align-items:center; justify-content:center;">
            <h2>Offline Mode</h2>
            <p>Use previous P2P code here.</p>
            <button onclick="location.reload()" class="action-btn" style="width:auto; padding:10px 30px; margin-top:20px;">Back</button>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const API_URL = "https://script.google.com/macros/s/AKfycbzNJzNxHm1G7gPURcn2dDGYtMw_p4X_QEXFXpXz3tq_ZbpUFNbTeRDg2UMkS3UWNhdfow/exec"; 

        // --- STATE ---
        let currentUser = localStorage.getItem('qr_user');
        let currentName = localStorage.getItem('qr_name') || currentUser;
        let currentPic = localStorage.getItem('qr_pic') || "";
        
        let activePartner = null;
        let pollTimer = null;

        // --- INIT ---
        function initMode(mode) {
            document.getElementById('mode-screen').style.display = 'none';
            if (mode === 'p2p') {
                document.getElementById('p2p-ui').style.display = 'flex';
            } else {
                if (currentUser) {
                    initDash();
                } else {
                    document.getElementById('auth-ui').style.display = 'flex';
                }
            }
        }

        // --- UI LOGIC ---
        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-screen').forEach(t => t.classList.remove('active-screen'));
            document.getElementById('tab-' + tabName).classList.add('active-screen');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');

            if(tabName === 'profile') loadProfileUI();
            if(tabName === 'inbox') loadInboxUI();
        }

        // --- AUTH ---
        async function handleCloudLogin() {
            const u = document.getElementById('c-user').value.trim();
            const p = document.getElementById('c-pass').value.trim();
            showLoader(true);
            const res = await api({ action: 'login', username: u, password: p });
            showLoader(false);
            
            if (res.status === 'success') {
                saveUserSession(res);
                document.getElementById('auth-ui').style.display = 'none';
                initDash();
            } else {
                alert(res.message);
            }
        }

        async function handleCloudSignup() {
            const u = document.getElementById('c-user').value.trim();
            const p = document.getElementById('c-pass').value.trim();
            showLoader(true);
            const res = await api({ action: 'signup', username: u, password: p });
            showLoader(false);
            if(res.status === 'success') alert("Account Created! Please Login.");
            else alert(res.message);
        }

        function saveUserSession(data) {
            currentUser = data.username;
            currentName = data.name;
            currentPic = data.profilePic;
            localStorage.setItem('qr_user', currentUser);
            localStorage.setItem('qr_name', currentName);
            localStorage.setItem('qr_pic', currentPic);
        }

        function cloudLogout() {
            localStorage.clear();
            location.reload();
        }

        function initDash() {
            document.getElementById('cloud-dash').style.display = 'flex';
            loadInboxUI();
        }

        // --- PROFILE ---
        function loadProfileUI() {
            document.getElementById('display-username').innerText = "@" + currentUser;
            document.getElementById('edit-name').value = currentName;
            document.getElementById('edit-pic').value = currentPic;
            if(currentPic) {
                document.getElementById('my-profile-pic').innerHTML = `<img src="${currentPic}">`;
            }
        }

        async function saveProfile() {
            const newName = document.getElementById('edit-name').value;
            const newPic = document.getElementById('edit-pic').value;
            
            showLoader(true);
            const res = await api({ action: 'updateProfile', username: currentUser, name: newName, profilePic: newPic });
            showLoader(false);
            
            if(res.status === 'success') {
                currentName = newName;
                currentPic = newPic;
                localStorage.setItem('qr_name', currentName);
                localStorage.setItem('qr_pic', currentPic);
                alert("Profile Updated");
                loadProfileUI();
            }
        }

        // --- SEARCH ---
        async function searchCloudUser(q) {
            const box = document.getElementById('search-results');
            if (q.length < 2) { box.innerHTML=''; return; }
            
            const res = await api({ action: 'search', query: q });
            box.innerHTML = '';
            
            if (res.status === 'success') {
                res.data.forEach(u => {
                    if (u.username === currentUser) return;
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <div class="user-avatar">
                            ${u.profilePic ? `<img src="${u.profilePic}">` : u.name[0]}
                        </div>
                        <div>
                            <b>${u.name}</b><br>
                            <span style="font-size:12px;color:#666">@${u.username}</span>
                        </div>
                    `;
                    div.onclick = () => openChat(u.username, u.name, u.profilePic);
                    box.appendChild(div);
                });
            }
        }

        // --- MESSAGING ---
        async function loadInboxUI() {
            // Fetch all messages to build inbox list locally (MVP approach)
            const res = await api({ action: 'getMessages', username: currentUser });
            const list = document.getElementById('inbox-list');
            list.innerHTML = '';

            if (res.status === 'success') {
                const msgs = res.data;
                const partners = {};
                
                // Group by partner
                msgs.forEach(m => {
                    const partner = m.sender === currentUser ? m.receiver : m.sender;
                    if(!partners[partner]) partners[partner] = m; // Store latest msg logic can be improved
                });

                if(Object.keys(partners).length === 0) {
                    list.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">No messages yet.</div>';
                    return;
                }

                Object.keys(partners).forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'chat-list-item';
                    div.innerHTML = `
                        <div class="user-avatar">${p[0].toUpperCase()}</div>
                        <div><b>${p}</b><br><span style="font-size:12px;color:#666">Click to chat</span></div>
                    `;
                    div.onclick = () => openChat(p, p, ""); // Pass name/pic if stored
                    list.appendChild(div);
                });
            }
        }

        function openChat(username, name, pic) {
            activePartner = username;
            document.getElementById('cloud-chat').style.display = 'flex';
            document.getElementById('chat-header-name').innerText = name || username;
            document.getElementById('chat-av-small').innerHTML = pic ? `<img src="${pic}">` : (name ? name[0] : "?");
            
            loadChatMsgs();
            pollTimer = setInterval(loadChatMsgs, 3000);
        }

        function closeChat() {
            clearInterval(pollTimer);
            document.getElementById('cloud-chat').style.display = 'none';
            activePartner = null;
        }

        async function sendCloudText() {
            const txt = document.getElementById('c-input').value;
            if(!txt) return;
            
            // Simple Encrypt
            const encrypted = CryptoJS.AES.encrypt(txt, 'SECRET').toString();
            document.getElementById('c-input').value = '';
            renderMsg(txt, 'sent');
            
            await api({
                action: 'sendMessage',
                sender: currentUser,
                receiver: activePartner,
                content: encrypted,
                type: 'text'
            });
        }

        async function loadChatMsgs() {
            if(!activePartner) return;
            const res = await api({ action: 'getMessages', username: currentUser });
            const box = document.getElementById('c-msg-list');
            
            const relevant = res.data.filter(m => 
                (m.sender === currentUser && m.receiver === activePartner) ||
                (m.sender === activePartner && m.receiver === currentUser)
            );
            
            if(box.childElementCount !== relevant.length) {
                box.innerHTML = '';
                relevant.slice(-20).forEach(m => {
                    let dec = "Locked";
                    try { dec = CryptoJS.AES.decrypt(m.content, 'SECRET').toString(CryptoJS.enc.Utf8); } catch(e){}
                    renderMsg(dec, m.sender === currentUser ? 'sent' : 'received');
                });
                box.scrollTop = box.scrollHeight;
            }
        }

        function renderMsg(txt, type) {
            const div = document.createElement('div');
            div.className = `msg-bubble ${type}`;
            div.innerText = txt;
            document.getElementById('c-msg-list').appendChild(div);
        }

        async function api(data) {
            try {
                const req = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                return await req.json();
            } catch(e) { return { status: 'error', message: e.toString() }; }
        }

        function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    </script>
</body>
</html>
